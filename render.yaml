services:
  # ── TraceGov Backend (Node/Express) ──────────────────────────────
  - type: web
    name: tracegov-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false   # set in Render dashboard
      - key: MONGODB_URI
        sync: false   # set in Render dashboard (Atlas connection string)
      - key: JWT_SECRET
        sync: false   # set in Render dashboard
      - key: AI_SERVICE_URL
        value: https://tracegov-ai-service.onrender.com
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: "true"
      - key: ENABLE_SMS_NOTIFICATIONS
        value: "true"
      - key: SMS_PROVIDER
        value: mock
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_NAME
        value: TraceGov
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # ── TraceGov AI Service (FastAPI / Python) ──────────────────────
  # NOTE: this is the service that wasn't working. The two non-obvious
  # things that consistently break Python+EasyOCR on Render are:
  #   1. Build/install: must install OpenCV headless + easyocr, which is
  #      ~1.5GB. Use `pip install --no-cache-dir` to keep the build layer
  #      small and the build from timing out.
  #   2. Model cache: EasyOCR downloads ~200MB of model files on first
  #      request. Mount a persistent disk at the cache path so the next
  #      cold-start doesn't re-download (and the request doesn't time out
  #      while the user waits).
  - type: web
    name: tracegov-ai-service
    runtime: python
    rootDir: ai-service
    plan: starter     # needs ≥ 1GB RAM for EasyOCR; bump to standard if OOM
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: easyocr-cache
      mountPath: /opt/render-project/.cache/EasyOCR
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT automatically; we honor it via $PORT in startCommand.
      - key: EASYOCR_MODULE_PATH
        value: /opt/render-project/.cache/EasyOCR
      - key: SSL_CERT_FILE
        value: /usr/local/lib/python3.11/site-packages/certifi/cacert.pem
      - key: LOG_LEVEL
        value: INFO
